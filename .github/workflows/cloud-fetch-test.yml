name: Cloud fetch test

# One-off check: does Yahoo Finance (via yahoo-finance2) answer requests from a
# GitHub Actions runner? Push trigger is limited to this file so it only runs
# when the workflow itself changes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cloud-fetch-test.yml"

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Fetch 5 tickers from Yahoo
        working-directory: server
        run: npx tsx scripts/cloudFetchTest.ts
